services:
  labtex:
    image: labtex-beta:beta-1
    pull_policy: never
    restart: unless-stopped
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ./labtex-data:/data
    environment:
      ALLOW_REGISTRATION: "true"
      REGISTRATION_CODE: ""
      SECURE_COOKIES: "false"
      TRUST_PROXY: "true"
      COMPILE_TIMEOUT_SECONDS: "120"
      MAX_CONCURRENT_COMPILES: "1"
      MAX_UPLOAD_MB: "50"
    cpus: "2"
    mem_limit: 2g
